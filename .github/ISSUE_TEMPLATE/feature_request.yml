name: 功能建议
description: 对站点、交互或工程流程的改进建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        RedBot 的定位是**极简的快捷入口**：不做内容聚合、不做账号、不做推荐算法。
        与这个定位冲突的建议大概率会被拒绝，但仍欢迎讨论。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 先描述问题，而不是直接给方案
      placeholder: 189 个条目里，我常常只想看最近更新过的几个源……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 希望它怎么工作？如果能画出交互更好
    validations:
      required: true

  - type: dropdown
    id: cost
    attributes:
      label: 你估计的实现成本
      options:
        - 很小（改文案或样式）
        - 中等（一个新组件 / 一段脚本）
        - 较大（新数据字段 / 新页面）
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 与项目定位的一致性
      options:
        - label: 这个建议不会让站点变成内容聚合或阅读器
          required: true
        - label: 它不需要账号体系或服务端
          required: true
