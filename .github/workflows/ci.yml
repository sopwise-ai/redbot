name: CI

# 刻意不加 paths 过滤：main 走分支保护，要求本工作流的检查通过才能合并；
# 一旦按目录过滤，只改文档的 PR 会永远等不到这个检查。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：本工作流只读仓库内容（不发布、不提 PR、不写评论）
permissions:
  contents: read

# 同一分支/PR 的旧运行自动取消：省 runner，也避免旧结果覆盖新结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id 保持 "ci"：分支保护规则里绑的就是这个名字
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # action 用 major tag 而非 commit SHA：SHA 更严格，但人工维护容易过期；
      # 依赖 Dependabot 的 github-actions 生态持续跟进（见 .github/dependabot.yml）。
      - uses: actions/checkout@v4
        with:
          # 后续步骤不需要带着 token 执行 git 命令
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      # 格式与文档：prettier + markdownlint（绕过本地钩子的提交只能在这里拦住）
      - name: Format check
        run: npm run format:check

      - name: Markdown lint
        run: npm run lint:md

      # 数据规范：schema、id/URL/名称唯一、分类配额、副标签白名单
      - name: Validate data
        run: npm run validate

      # 纯逻辑单测：数据规则（去重 / 配额 / 标签）与 README 渲染（锚点 / 标题唯一）
      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      # 校验 + 生成 README + 静态导出
      - name: Build
        run: npm run build

      # README 必须与数据保持一致：忘了重新生成会在这里挂掉
      - name: README up to date
        run: git diff --exit-code -- README.md

      # 产物自检：按钮必须真的进了静态 HTML（防止哪天改成纯客户端渲染）
      - name: Check exported HTML
        run: |
          count=$(grep -o 'target="_blank"' out/index.html | wc -l)
          echo "exported links: $count"
          test "$count" -ge 100
